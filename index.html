<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CycleCare</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="mark">CC</div>
        <div>
          <strong>CycleCare</strong>
          <small>Created by Girl Up @ Morris Hills Highschol</small>
        </div>
      </div>
    </header>

    <main>
      <section id="chooser" class="hero">
        <p class="eyebrow">WELCOME TO CYCLECARE</p>
        <h1>What would you like to learn about the Menstrual Cycle?</h1>
        <p class="lead">
          Choose a between four focused chatbots: Pain, Mood, Flow, and Physical Changes.
        </p>

        <div class="grid">
          <button class="card" data-bot="mood">
            <div class="icon">😊</div>
            <b>Mood</b>
            <p> Learn more about the various emotional symptoms of PMS, such as mood swings, PMDD, anxiety, sadness, irritability, and more!</p>
          </button>

          <button class="card" data-bot="pain">
            <div class="icon">🩹</div>
            <b>Pain</b>
            <p> Learn more about the various kinds of pain felt during periods, such as cramps, headaches, lower back pain, and more!</p>
          </button>

          <button class="card" data-bot="flow">
            <div class="icon">💧</div>
            <b>Flow</b>
            <p> Learn more about the various kinds of period flow, such as heavy or light flow, irregular bleeding, cycle timing, and more!</p>
          </button>

          <button class="card" data-bot="changes">
            <div class="icon">🌸</div>
            <b>Physical Changes</b>
            <p> Learn more about the various physical symptoms of PMS, such as acne, bloating, fatigue, constipation, and more!</p>
          </button>
        </div>
      </section>

      <section id="chat" class="chat hidden">
        <div class="layout">
          <aside class="side">
            <button id="backBtn" class="ghost">← All chatbots</button>
            <div id="sideIcon" class="icon">😊</div>
            <h2 id="sideTitle">Mood Chatbot</h2>
            <p id="sideDesc"></p>
            <div id="examples" class="examples"></div>
            <p id="disclaimer" class="disclaimer"></p>
          </aside>

          <div class="chatbox">
            <div class="top">
              <div>
                <strong id="chatTitle">Cycle Care</strong>
                <small id="status">Ready</small>
              </div>
              <button id="clearBtn" class="ghost">Clear chat</button>
            </div>

            <div id="messages" class="messages"></div>

            <form id="chatForm">
              <input
                id="messageInput"
                type="text"
                placeholder="Type your question here..."
                autocomplete="off"
              >
              <button class="send" type="submit">Send</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Important: normal script, NOT type="module" -->
  <script src="chatbot.js" defer></script>
</body>
</html>
